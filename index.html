<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <h1>Journal</h1>
  <p id="status" class="status" aria-live="polite"></p>
</header>

<section class="auth-section">
  <p id="auth-status" class="status" aria-live="polite">Not signed in</p>
  <div class="auth-actions">
    <button id="signin-btn" type="button" class="btn">Sign in with Google</button>
    <button id="signout-btn" type="button" class="btn btn-secondary hidden">Sign out</button>
  </div>
</section>

<main id="journal-section" class="hidden">
  <ul id="entries" class="entries"></ul>
  <p id="empty" class="empty hidden">No entries yet — tap + to write your first one.</p>
</main>

<button id="fab" type="button" class="fab hidden" aria-label="New entry">+</button>

<div id="editor-overlay" class="editor-overlay hidden">
  <div class="editor">
    <h2 id="editor-title">New entry</h2>
    <textarea id="editor-textarea" placeholder="Write your entry…"></textarea>
    <div class="editor-actions">
      <button id="editor-cancel-btn" type="button" class="btn btn-secondary">Cancel</button>
      <button id="editor-done-btn" type="button" class="btn">Done</button>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" defer></script>
<script src="app.js" defer></script>
</body>
</html>
